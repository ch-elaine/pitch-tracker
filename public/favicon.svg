<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pitch Tracker">
  <defs>
    <clipPath id="rounded"><rect width="100" height="100" rx="20" /></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Transgender pride flag stripes -->
    <rect y="0"  width="100" height="20" fill="#5BCEFA" />
    <rect y="20" width="100" height="20" fill="#F5A9B8" />
    <rect y="40" width="100" height="20" fill="#FFFFFF" />
    <rect y="60" width="100" height="20" fill="#F5A9B8" />
    <rect y="80" width="100" height="20" fill="#5BCEFA" />
    <!-- Pitch bars -->
    <g fill="#312e81">
      <rect x="16"   y="34.7" width="10.4" height="30.6" rx="2.5" />
      <rect x="30.4" y="25.5" width="10.4" height="48.9" rx="2.5" />
      <rect x="44.8" y="16"   width="10.4" height="68"   rx="2.5" />
      <rect x="59.2" y="28.9" width="10.4" height="42.2" rx="2.5" />
      <rect x="73.6" y="33"   width="10.4" height="34"   rx="2.5" />
    </g>
  </g>
</svg>
